<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso de Java</title>
<style>
:root{
  --bg:#ffffff; --bg-2:#f6f8fa; --bg-3:#eef1f4;
  --tx:#1f2328; --tx-2:#59636e; --tx-3:#818b98;
  --bd:#d8dee4; --bd-2:#e4e8ec;
  --ac:#0550ae; --ac-bg:#ddf4ff;
  --cod-bg:#f6f8fa; --cod-tx:#1f2328;
  --kw:#cf222e; --ty:#8250df; --str:#0a3069; --com:#6e7781; --num:#0550ae; --fn:#8250df; --pre:#a40e26;
  --ann:#953800;
  --sombra:0 1px 3px rgba(31,35,40,.12);
}
html[data-t="escuro"]{
  --bg:#0d1117; --bg-2:#161b22; --bg-3:#21262d;
  --tx:#e6edf3; --tx-2:#9198a1; --tx-3:#6e7681;
  --bd:#30363d; --bd-2:#21262d;
  --ac:#4493f8; --ac-bg:#121d2f;
  --cod-bg:#161b22; --cod-tx:#e6edf3;
  --kw:#ff7b72; --ty:#d2a8ff; --str:#a5d6ff; --com:#8b949e; --num:#79c0ff; --fn:#d2a8ff; --pre:#ff7b72;
  --ann:#ffa657;
  --sombra:0 1px 3px rgba(1,4,9,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:flex; background:var(--bg); color:var(--tx);
  font:15px/1.6 -apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--tx-3)}

/* ---------------- barra lateral ---------------- */
#lateral{
  width:300px; flex:0 0 300px; height:100vh; background:var(--bg-2);
  border-right:1px solid var(--bd); display:flex; flex-direction:column;
}
#marca{
  padding:16px 18px 12px; border-bottom:1px solid var(--bd); flex:0 0 auto;
}
#marca h1{
  margin:0; font-size:15px; font-weight:700; letter-spacing:-.2px;
  display:flex; align-items:center; gap:8px;
}
#marca .logo{
  width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#0550ae,#8250df);
  color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;
}
#marca p{margin:3px 0 0 32px;font-size:11.5px;color:var(--tx-2)}

#cxbusca{padding:10px 12px;flex:0 0 auto}
#busca{
  width:100%; padding:7px 10px 7px 30px; border:1px solid var(--bd); border-radius:7px;
  background:var(--bg); color:var(--tx); font:inherit; font-size:13px; outline:none;
}
#busca:focus{border-color:var(--ac); box-shadow:0 0 0 3px var(--ac-bg)}
#cxbusca{position:relative}
#cxbusca svg{position:absolute;left:22px;top:18px;width:14px;height:14px;stroke:var(--tx-3);fill:none;stroke-width:2}

#nav{flex:1 1 auto; overflow-y:auto; padding:0 8px 24px}
.grupo{margin-bottom:2px}
.gcab{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--tx);user-select:none;
}
.gcab:hover{background:var(--bg-3)}
.gcab .seta{
  margin-left:auto;width:12px;height:12px;stroke:var(--tx-3);fill:none;stroke-width:2.2;
  transition:transform .18s ease;
}
.grupo.aberto .gcab .seta{transform:rotate(90deg)}
.gcab .num{
  width:20px;height:20px;border-radius:5px;background:var(--bg-3);color:var(--tx-2);
  font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;
}
.grupo.aberto .gcab .num,.gcab:hover .num{background:var(--ac);color:#fff}
.gcab .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcab .tema{display:block;font-size:10.5px;font-weight:400;color:var(--tx-3)}
.filhos{display:none;margin:1px 0 6px 14px;padding-left:12px;border-left:1px solid var(--bd)}
.grupo.aberto .filhos{display:block}
.item{
  display:block;padding:5.5px 10px;border-radius:6px;font-size:12.5px;color:var(--tx-2);
  cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item:hover{background:var(--bg-3);color:var(--tx)}
.item.ativo{background:var(--ac);color:#fff;font-weight:600}
.item.solo{margin:1px 0;font-size:13px;font-weight:600;color:var(--tx);padding:7px 10px}
.item.solo:hover{background:var(--bg-3)}
.item.solo.ativo{background:var(--ac);color:#fff}

#rodape{
  flex:0 0 auto;padding:9px 12px;border-top:1px solid var(--bd);
  display:flex;align-items:center;gap:8px;
}
.btn{
  border:1px solid var(--bd);background:var(--bg);color:var(--tx-2);border-radius:6px;
  padding:5px 9px;font:inherit;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:5px;
}
.btn:hover{background:var(--bg-3);color:var(--tx)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------------- conteudo ---------------- */
#principal{flex:1 1 auto;height:100vh;overflow-y:auto;scroll-behavior:smooth;position:relative}
#topo{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--bd-2);
  padding:11px 40px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--tx-2);
}
#topo .trilha{font-weight:500}
#topo .prog{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:11.5px}
#barra{width:90px;height:5px;background:var(--bg-3);border-radius:3px;overflow:hidden}
#barra i{display:block;height:100%;width:0;background:var(--ac);border-radius:3px;transition:width .12s}

#doc{max-width:860px;margin:0 auto;padding:28px 40px 100px}
#doc h1,#doc h2,#doc h3,#doc h4{line-height:1.3;font-weight:700;scroll-margin-top:64px}
#doc h1{font-size:27px;margin:0 0 18px;padding-bottom:11px;border-bottom:1px solid var(--bd);letter-spacing:-.4px}
#doc h2{font-size:20px;margin:34px 0 13px;padding-bottom:7px;border-bottom:1px solid var(--bd-2);letter-spacing:-.2px}
#doc h3{font-size:16px;margin:24px 0 9px}
#doc h4{font-size:14px;margin:18px 0 7px;color:var(--tx-2)}
#doc p{margin:0 0 13px}
#doc ul,#doc ol{margin:0 0 13px;padding-left:26px}
#doc li{margin:4px 0}
#doc li>ul,#doc li>ol{margin:4px 0}
#doc a{color:var(--ac);text-decoration:none}
#doc a:hover{text-decoration:underline}
#doc hr{border:0;border-top:1px solid var(--bd);margin:26px 0}
#doc strong{font-weight:650}
#doc code{
  background:var(--bg-3);padding:.15em .38em;border-radius:5px;font-size:.875em;
  font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
#doc del{color:var(--tx-3)}

.rolagem-tabela{overflow-x:auto;margin:0 0 15px;border:1px solid var(--bd);border-radius:8px}
#doc table{border-collapse:collapse;width:100%;font-size:13.5px}
#doc th,#doc td{padding:8px 13px;border-bottom:1px solid var(--bd-2);text-align:left;vertical-align:top}
#doc th{background:var(--bg-2);font-weight:650;white-space:nowrap}
#doc tr:last-child td{border-bottom:0}
#doc tbody tr:hover{background:var(--bg-2)}

.bloco-codigo{position:relative;margin:0 0 15px}
.bloco-codigo pre{
  margin:0;background:var(--cod-bg);border:1px solid var(--bd);border-radius:8px;
  padding:13px 15px;overflow-x:auto;
}
.bloco-codigo code{
  background:none;padding:0;font-size:12.9px;line-height:1.55;color:var(--cod-tx);
  font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
.bloco-codigo .lang{
  position:absolute;top:9px;right:62px;font-size:10px;color:var(--tx-3);
  text-transform:uppercase;letter-spacing:.5px;font-weight:600;pointer-events:none;
}
.bloco-codigo .copiar{
  position:absolute;top:6px;right:7px;border:1px solid var(--bd);background:var(--bg);
  color:var(--tx-2);border-radius:5px;padding:3px 8px;font:inherit;font-size:10.5px;
  cursor:pointer;opacity:0;transition:opacity .14s;
}
.bloco-codigo:hover .copiar{opacity:1}
.bloco-codigo .copiar:hover{background:var(--bg-3);color:var(--tx)}
.bloco-codigo .copiar.ok{color:#1a7f37;border-color:#1a7f37}

.kw{color:var(--kw)}.ty{color:var(--ty)}.str{color:var(--str)}
.com{color:var(--com);font-style:italic}.num{color:var(--num)}
.fn{color:var(--fn)}.pre{color:var(--pre)}.flag{color:var(--num)}.cmd{color:var(--kw)}
.ann{color:var(--ann)}
/* Caminho do arquivo dentro do projeto Spring, acima do bloco de codigo. */
.nota-arquivo{
  margin:-2px 0 10px; font-size:12.5px; color:var(--tx-2);
  font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
}

.alerta{
  border:1px solid var(--bd);border-left:3px solid var(--tx-3);border-radius:7px;
  padding:11px 15px;margin:0 0 15px;background:var(--bg-2);font-size:14px;
}
.alerta-tit{font-weight:650;margin-bottom:4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
.alerta>*:last-child{margin-bottom:0}
.alerta .bloco-codigo{margin:9px 0 0}
.alerta .bloco-codigo pre{background:var(--bg)}
.alerta.tip{border-left-color:#1a7f37} .alerta.tip .alerta-tit{color:#1a7f37}
.alerta.note{border-left-color:#0969da} .alerta.note .alerta-tit{color:#0969da}
.alerta.important{border-left-color:#8250df} .alerta.important .alerta-tit{color:#8250df}
.alerta.warning{border-left-color:#9a6700} .alerta.warning .alerta-tit{color:#9a6700}
.alerta.caution{border-left-color:#cf222e} .alerta.caution .alerta-tit{color:#cf222e}
html[data-t="escuro"] .alerta.tip{border-left-color:#3fb950}
html[data-t="escuro"] .alerta.tip .alerta-tit{color:#3fb950}
html[data-t="escuro"] .alerta.note{border-left-color:#4493f8}
html[data-t="escuro"] .alerta.note .alerta-tit{color:#4493f8}
html[data-t="escuro"] .alerta.important{border-left-color:#ab7df8}
html[data-t="escuro"] .alerta.important .alerta-tit{color:#ab7df8}
html[data-t="escuro"] .alerta.warning{border-left-color:#d29922}
html[data-t="escuro"] .alerta.warning .alerta-tit{color:#d29922}
html[data-t="escuro"] .alerta.caution{border-left-color:#f85149}
html[data-t="escuro"] .alerta.caution .alerta-tit{color:#f85149}

/* navegacao inferior */
#passos{display:flex;gap:12px;margin-top:44px;padding-top:22px;border-top:1px solid var(--bd)}
.passo{
  flex:1;border:1px solid var(--bd);border-radius:9px;padding:12px 15px;cursor:pointer;
  background:var(--bg);transition:border-color .14s,box-shadow .14s;
}
.passo:hover{border-color:var(--ac);box-shadow:var(--sombra)}
.passo.vazio{visibility:hidden}
.passo .r{font-size:10.5px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.passo .t{font-size:13.5px;font-weight:600;color:var(--ac);margin-top:3px}
.passo.prox{text-align:right}

/* busca */
#resultados{padding:8px 4px}
.rgrupo{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx-3);
  font-weight:700;padding:9px 10px 4px}
.rhit{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.rhit:hover{background:var(--bg-3)}
.rhit .rt{font-weight:600;color:var(--tx)}
.rhit .rc{color:var(--tx-2);font-size:11.5px;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rhit mark{background:#fff3c4;color:inherit;border-radius:2px;padding:0 1px}
html[data-t="escuro"] .rhit mark{background:#5c4813;color:#f0e68c}
#vazio{padding:22px 12px;text-align:center;color:var(--tx-3);font-size:12.5px}
mark.alvo{background:#fff3c4;border-radius:2px;animation:esmaece 2.4s ease forwards}
html[data-t="escuro"] mark.alvo{background:#5c4813}
@keyframes esmaece{0%,55%{background:#ffe066}100%{background:transparent}}
html[data-t="escuro"] mark.alvo{animation:esmaece-e 2.4s ease forwards}
@keyframes esmaece-e{0%,55%{background:#6b5416}100%{background:transparent}}

@media(max-width:820px){
  #lateral{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.menu #lateral{transform:none}
  #doc{padding:22px 20px 80px}
  #topo{padding:11px 20px}
  #hamb{display:flex!important}
  body.menu::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
}
#hamb{display:none;border:1px solid var(--bd);background:var(--bg);border-radius:6px;
  padding:5px 8px;cursor:pointer;color:var(--tx)}
#hamb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
</style>
</head>
<body>

<aside id="lateral">
  <div id="marca">
    <h1><span class="logo">J</span> Curso de Java</h1>
    <p>dos fundamentos ao Spring Boot</p>
  </div>

  <div id="cxbusca">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="busca" type="text" placeholder="Buscar no curso..." autocomplete="off" spellcheck="false">
  </div>

  <nav id="nav"></nav>

  <div id="rodape">
    <button class="btn" id="btema">
      <svg id="itema" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="ttema">Escuro</span>
    </button>
    <button class="btn" id="bimprimir">
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>
      Imprimir
    </button>
  </div>
</aside>

<main id="principal">
  <header id="topo">
    <button id="hamb"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <span class="trilha" id="trilha"></span>
    <span class="prog"><span id="ppct">0%</span><span id="barra"><i></i></span></span>
  </header>
  <article id="doc"></article>
</main>

<script>
/* O conteudo do curso e injetado aqui em tempo de build. */
const DADOS = /*__CONTEUDO__*/{secoes:[],nav:[]}/*__FIM__*/;

const $ = s => document.querySelector(s);
const nav = $("#nav"), doc = $("#doc"), principal = $("#principal");
const mapa = new Map(DADOS.secoes.map(s => [s.id, s]));
const ordem = DADOS.secoes.map(s => s.id);
let atual = null;

/* ---------- barra lateral ---------- */
function montarNav(){
  nav.innerHTML = "";
  DADOS.nav.forEach(g => {
    if(!g.filhos || !g.filhos.length){
      const a = document.createElement("div");
      a.className = "item solo"; a.dataset.id = g.id; a.textContent = g.t;
      a.onclick = () => abrir(g.id);
      nav.appendChild(a);
      return;
    }
    const grupo = document.createElement("div");
    grupo.className = "grupo"; grupo.dataset.grupo = g.id;

    const cab = document.createElement("div");
    cab.className = "gcab";
    const n = (g.t.match(/\d+/) || [""])[0];
    cab.innerHTML = `<span class="num">${n}</span>
      <span class="txt">${g.t}<span class="tema">${g.sub_t || ""}</span></span>
      <svg class="seta" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>`;
    cab.onclick = () => {
      const jaAberto = grupo.classList.contains("aberto");
      grupo.classList.toggle("aberto");
      if(!jaAberto && g.filhos[0]) abrir(g.filhos[0].id);
    };
    grupo.appendChild(cab);

    const filhos = document.createElement("div");
    filhos.className = "filhos";
    g.filhos.forEach(f => {
      const a = document.createElement("a");
      a.className = "item"; a.dataset.id = f.id; a.textContent = f.t;
      a.onclick = e => { e.preventDefault(); abrir(f.id); };
      filhos.appendChild(a);
    });
    grupo.appendChild(filhos);
    nav.appendChild(grupo);
  });
}

function marcarAtivo(id){
  document.querySelectorAll(".item").forEach(el =>
    el.classList.toggle("ativo", el.dataset.id === id));
  const grupo = DADOS.nav.find(g => g.filhos && g.filhos.some(f => f.id === id));
  if(grupo){
    const el = nav.querySelector(`[data-grupo="${grupo.id}"]`);
    if(el) el.classList.add("aberto");
  }
}

/* ---------- abrir secao ---------- */
function abrir(id, ancora){
  const s = mapa.get(id);
  if(!s) return;
  atual = id;
  doc.innerHTML = s.html + rodapePassos(id);
  marcarAtivo(id);

  const g = DADOS.nav.find(x => x.filhos && x.filhos.some(f => f.id === id));
  const f = g && g.filhos.find(x => x.id === id);
  $("#trilha").textContent = g ? (g.t + (f ? "  ›  " + f.t : "")) : s.titulo;

  ligarCopiar();
  document.body.classList.remove("menu");

  if(ancora){
    const alvo = document.getElementById(ancora);
    if(alvo){ alvo.scrollIntoView(); return; }
  }
  principal.scrollTop = 0;
  atualizarProgresso();
}

function rodapePassos(id){
  const i = ordem.indexOf(id);
  const ant = i > 0 ? mapa.get(ordem[i-1]) : null;
  const prox = i < ordem.length-1 ? mapa.get(ordem[i+1]) : null;
  const cx = s => s ? `<div class="passo" data-ir="${s.id}"><div class="r">Anterior</div><div class="t">${s.titulo}</div></div>` : `<div class="passo vazio"></div>`;
  const cx2 = s => s ? `<div class="passo prox" data-ir="${s.id}"><div class="r">Proximo</div><div class="t">${s.titulo}</div></div>` : `<div class="passo vazio"></div>`;
  return `<div id="passos">${cx(ant)}${cx2(prox)}</div>`;
}

doc.addEventListener("click", e => {
  const p = e.target.closest("[data-ir]");
  if(p){ abrir(p.dataset.ir); return; }
  const a = e.target.closest('a[href^="#"]');
  if(a){
    e.preventDefault();
    const alvo = a.getAttribute("href").slice(1);
    // "secao|ancora" abre a secao e rola ate o ponto exato dentro dela.
    if(alvo.includes("|")){
      const [secao, ancora] = alvo.split("|");
      if(mapa.has(secao)){ abrir(secao, ancora); return; }
    }
    if(mapa.has(alvo)) abrir(alvo);
    else {
      const el = document.getElementById(alvo);
      if(el) el.scrollIntoView({behavior:"smooth"});
    }
  }
});

/* ---------- copiar codigo ---------- */
function ligarCopiar(){
  doc.querySelectorAll(".copiar").forEach(b => {
    b.onclick = () => {
      const cod = b.parentElement.querySelector("code").innerText;
      navigator.clipboard.writeText(cod).then(() => {
        b.textContent = "copiado"; b.classList.add("ok");
        setTimeout(() => { b.textContent = "copiar"; b.classList.remove("ok"); }, 1400);
      });
    };
  });
}

/* ---------- progresso ---------- */
function atualizarProgresso(){
  const h = principal.scrollHeight - principal.clientHeight;
  const p = h > 20 ? Math.min(100, Math.round(principal.scrollTop / h * 100)) : 0;
  $("#barra").firstElementChild.style.width = p + "%";
  $("#ppct").textContent = p + "%";
}
principal.addEventListener("scroll", atualizarProgresso, {passive:true});

/* ---------- busca ---------- */
const textoPuro = new Map();
DADOS.secoes.forEach(s => {
  const d = document.createElement("div");
  d.innerHTML = s.html;
  // O rotulo da linguagem e o botao "copiar" sao cromo da interface:
  // indexa-los poluiria os trechos de resultado com "Javacopiar".
  d.querySelectorAll(".lang, .copiar").forEach(el => el.remove());
  textoPuro.set(s.id, d.textContent.replace(/\s+/g," "));
});

function escapeHtml(t){
  return t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

let ultimaBusca = "";
$("#busca").addEventListener("input", e => {
  const q = e.target.value.trim();
  ultimaBusca = q;
  if(q.length < 2){ montarNav(); marcarAtivo(atual); return; }

  const alvo = q.toLowerCase();
  const achados = [];
  DADOS.secoes.forEach(s => {
    const txt = textoPuro.get(s.id);
    const baixo = txt.toLowerCase();
    let i = baixo.indexOf(alvo), n = 0;
    const trechos = [];
    while(i !== -1 && n < 3){
      trechos.push({i, txt: txt.slice(Math.max(0,i-45), i+95)});
      i = baixo.indexOf(alvo, i+1); n++;
    }
    let total = 0, j = baixo.indexOf(alvo);
    while(j !== -1){ total++; j = baixo.indexOf(alvo, j+1); }
    if(trechos.length) achados.push({s, trechos, total});
  });
  achados.sort((a,b) => b.total - a.total);

  nav.innerHTML = "";
  if(!achados.length){
    nav.innerHTML = `<div id="vazio">Nada encontrado para<br><strong>${escapeHtml(q)}</strong></div>`;
    return;
  }
  const cx = document.createElement("div");
  cx.id = "resultados";
  const tot = achados.reduce((a,b) => a + b.total, 0);
  cx.innerHTML = `<div class="rgrupo">${tot} ocorrência${tot>1?"s":""} em ${achados.length} ${achados.length>1?"seções":"seção"}</div>`;
  achados.slice(0, 12).forEach(({s, trechos, total}) => {
    const d = document.createElement("div");
    d.className = "rhit";
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    d.innerHTML = `<div class="rt">${escapeHtml(s.titulo)} <span style="color:var(--tx-3);font-weight:400">(${total})</span></div>
                   <div class="rc">...${escapeHtml(trechos[0].txt).replace(re,"<mark>$1</mark>")}...</div>`;
    d.onclick = () => { abrir(s.id); setTimeout(() => realcar(q), 30); };
    cx.appendChild(d);
  });
  nav.appendChild(cx);
});

function realcar(q){
  if(!q) return;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
  const anda = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest("#passos") ? NodeFilter.FILTER_REJECT
                   : (re.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT)
  });
  const nos = [];
  let n; while(n = anda.nextNode()) nos.push(n);
  let primeiro = null;
  nos.forEach(no => {
    const frag = document.createDocumentFragment();
    let pos = 0; const t = no.nodeValue;
    t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi"), (m, off) => {
      frag.appendChild(document.createTextNode(t.slice(pos, off)));
      const mk = document.createElement("mark");
      mk.className = "alvo"; mk.textContent = m;
      frag.appendChild(mk);
      if(!primeiro) primeiro = mk;
      pos = off + m.length;
      return m;
    });
    frag.appendChild(document.createTextNode(t.slice(pos)));
    no.parentNode.replaceChild(frag, no);
  });
  if(primeiro) primeiro.scrollIntoView({block:"center"});
}

/* ---------- tema ---------- */
function aplicarTema(t){
  document.documentElement.dataset.t = t;
  $("#ttema").textContent = t === "escuro" ? "Claro" : "Escuro";
  $("#itema").innerHTML = t === "escuro"
    ? '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  try{ localStorage.setItem("tema-java", t); }catch(e){}
}
$("#btema").onclick = () =>
  aplicarTema(document.documentElement.dataset.t === "escuro" ? "claro" : "escuro");

$("#bimprimir").onclick = () => window.print();
$("#hamb").onclick = () => document.body.classList.toggle("menu");

/* ---------- teclado ---------- */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "f"){ e.preventDefault(); $("#busca").focus(); $("#busca").select(); }
  if(e.key === "Escape"){ $("#busca").value=""; montarNav(); marcarAtivo(atual); $("#busca").blur(); }
  if(e.altKey && e.key === "ArrowRight"){ const i = ordem.indexOf(atual); if(i < ordem.length-1) abrir(ordem[i+1]); }
  if(e.altKey && e.key === "ArrowLeft"){ const i = ordem.indexOf(atual); if(i > 0) abrir(ordem[i-1]); }
});

/* ---------- inicio ---------- */
let temaInicial = "claro";
try{ temaInicial = localStorage.getItem("tema-java")
  || (matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro"); }catch(e){}
aplicarTema(temaInicial);
montarNav();
abrir("inicio");
</script>
