# ============================================================
# CONFIGURACAO DA APLICACAO
# Este arquivo substitui centenas de linhas de XML do Spring antigo.
# ============================================================

spring.application.name=curso-api

# Porta do servidor embutido (Tomcat). Troque se a 8080 estiver ocupada.
server.port=8080

# ============================================================
# BANCO DE DADOS: H2 EM MEMORIA
# Escolhido para o curso porque nao exige instalar nada.
# ATENCAO: os dados somem quando a aplicacao para. Isso e proposital aqui.
# ============================================================
spring.datasource.url=jdbc:h2:mem:cursodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
# Use a URL jdbc:h2:mem:cursodb, usuario 'sa' e senha vazia para entrar.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JPA / HIBERNATE
# ============================================================

# ddl-auto controla como o Hibernate lida com o schema:
#   create-drop -> cria as tabelas ao subir e apaga ao parar (ideal para estudo)
#   update      -> ajusta as tabelas conforme as entidades mudam (comum em dev)
#   validate    -> apenas confere se o schema bate com as entidades
#   none        -> nao mexe em nada (O CORRETO EM PRODUCAO, com Flyway cuidando)
spring.jpa.hibernate.ddl-auto=create-drop

# Mostra no console o SQL que o Hibernate gera.
# Deixe ligado enquanto estuda: ver o SQL real e a melhor forma de entender
# o que cada query method do repositorio esta fazendo por baixo dos panos.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ============================================================
# JSON
# ============================================================
spring.jackson.serialization.indent-output=true

